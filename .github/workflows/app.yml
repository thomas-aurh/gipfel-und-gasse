# Prüft die Web-App, baut die Android-App und stellt sie nach dem Merge auf main als Download bereit:
# https://github.com/thomas-aurh/gipfel-und-gasse/releases/latest/download/Gipfel-und-Gasse.apk
name: App

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# je Branch höchstens ein Lauf: ein neuerer Push bricht den älteren ab, damit ein alter Bau die Download-Seite nicht
# mit einer älteren APK überschreibt
concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Abhängigkeiten (Offline-Bündel)
        run: npm ci
      - name: Web-App prüfen (Syntax, Einheitstests)
        run: sh web/pruefen.sh

  # Klicktest: bedient die Oberfläche in Chromium (Dienste nachgebildet, Testkarten aus web/test/testkarten.py).
  # Pflicht seit dem 03.11.: ohne ihn war main unbemerkt rot (Info-Fenster nach #50).
  klicktest:
    needs: pruefen
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: |
          npm ci
          npx playwright install --with-deps chromium-headless-shell
          pip install mapbox-vector-tile==2.2.0 pmtiles==3.8.1 pillow==12.3.0
      - name: Web-App bauen
        run: sh web/pruefen.sh
      - name: Klicktest
        run: node web/test/ui.js
      - name: Bildschirmfotos bei Fehler
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: klicktest-bilder
          path: web/test/out/*.png
          retention-days: 7

  apk:
    needs: [pruefen, klicktest]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # für die Download-Seite (Release) nach dem Merge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Abhängigkeiten
        run: npm ci

      - name: Web-App in die App kopieren
        run: npm run sync

      - name: Routen-Engine BRouter holen (feste Fassung)
        run: sh werkzeuge/brouter-holen.sh

      # Fester Schlüssel (siehe STAND.md), in dieser Reihenfolge:
      # 1. KEYSTORE_B64 + KEYSTORE_PASSWORT als Repo-Geheimnisse (Schlüssel von außen),
      # 2. nur KEYSTORE_PASSWORT: GitHub legt den Schlüssel beim ersten Bau auf main selbst an und bewahrt ihn mit diesem
      #    Passwort verschlüsselt im Entwurfs-Release „signierschluessel“ auf (Entwürfe sieht nur, wer Schreibrecht hat);
      #    jeder Bau holt ihn dort. Der Schlüssel verlässt GitHub nie unverschlüsselt.
      # Ohne beides: Ersatzschlüssel, der einmal angelegt wird und zwischen den Läufen im Cache liegt.
      - name: Signierschlüssel
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORT: ${{ secrets.KEYSTORE_PASSWORT }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ks=android/app/release.keystore
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$ks"
            echo "Fester Schlüssel aus den Geheimnissen"
          elif [ -n "$KEYSTORE_PASSWORT" ]; then
            tmp=$(mktemp -d)
            if gh release download signierschluessel -p fest.keystore.enc -D "$tmp" 2>/dev/null; then
              # falsches Passwort bricht hier ab: lieber kein Bau als einer mit fremdem Schlüssel
              openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in "$tmp/fest.keystore.enc" -out "$ks" -pass env:KEYSTORE_PASSWORT
              echo "Fester Schlüssel aus dem Entwurfs-Release"
            elif [ "$GITHUB_REF" = refs/heads/main ] && [ "$GITHUB_EVENT_NAME" != pull_request ]; then
              keytool -genkeypair -keystore "$ks" -storetype PKCS12 -storepass:env KEYSTORE_PASSWORT -keypass:env KEYSTORE_PASSWORT \
                -alias gipfelundgasse -keyalg RSA -keysize 4096 -validity 20000 -dname "CN=Gipfel und Gasse"
              openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -in "$ks" -out "$tmp/fest.keystore.enc" -pass env:KEYSTORE_PASSWORT
              gh release create signierschluessel --draft --title "Signierschlüssel (verschlüsselt, nicht löschen)" \
                --notes "Fester Signierschlüssel der App, verschlüsselt mit dem Geheimnis KEYSTORE_PASSWORT. Nicht veröffentlichen und nicht löschen: ohne ihn lassen sich Updates nicht mehr über die installierte App legen." \
                "$tmp/fest.keystore.enc"
              echo "::warning::Neuer fester Schlüssel angelegt: diese APK einmal neu installieren (vorher Sicherung speichern)."
            else
              echo "::warning::Fester Schlüssel noch nicht angelegt (geschieht beim nächsten Bau auf main): Ersatzschlüssel aus dem Cache"
            fi
            rm -rf "$tmp"
          else
            echo "::warning::Kein fester Schlüssel hinterlegt: Ersatzschlüssel aus dem Cache"
          fi
          if [ -f "$ks" ]; then
            keytool -list -v -keystore "$ks" -storepass:env KEYSTORE_PASSWORT -alias "${KEYSTORE_ALIAS:-gipfelundgasse}" | grep -E "SHA256:" | head -1
          fi
      - name: Ersatzschlüssel aus dem Cache
        if: hashFiles('android/app/release.keystore') == ''
        uses: actions/cache@v4
        with:
          path: android/app/ci.keystore
          key: ci-keystore-v1
      - name: Ersatzschlüssel anlegen, falls keiner da ist; Fingerabdruck zeigen
        run: |
          cd android/app
          if [ ! -f release.keystore ] && [ ! -f ci.keystore ]; then
            echo "::warning::Neuer Ersatzschlüssel: Diese APK lässt sich nicht über eine mit anderem Schlüssel installierte App legen."
            keytool -genkeypair -keystore ci.keystore -storepass gipfelundgasse -keypass gipfelundgasse -alias ci \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Gipfel und Gasse (GitHub Actions)"
          fi
          if [ -f ci.keystore ] && [ ! -f release.keystore ]; then
            keytool -list -v -keystore ci.keystore -storepass gipfelundgasse -alias ci | grep -E "SHA256:" | head -1
          fi

      - name: Java-Tests und APK bauen
        working-directory: android
        env:
          KEYSTORE_PASSWORT: ${{ secrets.KEYSTORE_PASSWORT }}
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - name: APK umbenennen
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Gipfel-und-Gasse.apk
          ls -la Gipfel-und-Gasse.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Gipfel-und-Gasse-apk
          path: Gipfel-und-Gasse.apk
          retention-days: 14

      - name: Download-Seite erneuern (nur auf main)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        # Der Link …/releases/download/neueste/Gipfel-und-Gasse.apk soll nie ins Leere gehen: die Seite bleibt bestehen,
        # die neue APK kommt unter einem Zwischennamen dazu und ersetzt die alte erst danach (nur Umbenennen, kein Neuanlegen)
        run: |
          titel="Gipfel & Gasse – neueste Fassung (Bau ${{ github.run_number }})"
          text="Android-App zum Selbstinstallieren. Auf dem Handy diese Seite öffnen, Gipfel-und-Gasse.apk antippen, Installation aus dieser Quelle einmal erlauben. Stand: ${{ github.sha }}"
          # GitHub antwortet zeitweise mit 502 (04.11. zweimal): jeder Aufruf bis zu fünfmal, mit wachsender Pause.
          # Alle Schritte sind wiederholbar (Umbenennen, Hochladen mit --clobber, Tag, Titel); Löschen darf scheitern,
          # ein liegengebliebenes -alt räumt der nächste Lauf weg.
          wdh() { n=1; until "$@"; do [ "$n" -ge 5 ] && return 1; echo "GitHub-Aufruf fehlgeschlagen, Versuch $((n + 1)) in $((n * 5)) s" >&2; sleep $((n * 5)); n=$((n + 1)); done; }
          if ! wdh gh release view neueste >/dev/null 2>&1; then
            gh release create neueste Gipfel-und-Gasse.apk --latest --target "${{ github.sha }}" --title "$titel" --notes "$text"
            exit 0
          fi
          R="repos/${{ github.repository }}"
          rel=$(wdh gh api "$R/releases/tags/neueste" --jq .id)
          asset() { wdh gh api "$R/releases/$rel/assets" --jq ".[] | select(.name == \"$1\") | .id"; }
          umbenennen() { wdh gh api -X PATCH "$R/releases/assets/$1" -f name="$2" >/dev/null; }
          loeschen() { gh api -X DELETE "$R/releases/assets/$1" || echo "Löschen von $1 gescheitert, der nächste Lauf räumt auf" >&2; }
          # Rest eines abgebrochenen Laufs: fehlt die APK, die zur Seite gerückte zurückholen
          if [ -z "$(asset Gipfel-und-Gasse.apk)" ] && [ -n "$(asset Gipfel-und-Gasse-alt.apk)" ]; then
            umbenennen "$(asset Gipfel-und-Gasse-alt.apk)" Gipfel-und-Gasse.apk
          fi
          a=$(asset Gipfel-und-Gasse-alt.apk); if [ -n "$a" ]; then loeschen "$a"; fi
          cp Gipfel-und-Gasse.apk Gipfel-und-Gasse-neu.apk
          wdh gh release upload neueste Gipfel-und-Gasse-neu.apk --clobber
          neu=$(asset Gipfel-und-Gasse-neu.apk); test -n "$neu"
          alt=$(asset Gipfel-und-Gasse.apk)
          # alte zur Seite (bleibt für die Wiederherstellung), neue an ihren Platz; scheitert das, alte zurück
          if [ -n "$alt" ]; then umbenennen "$alt" Gipfel-und-Gasse-alt.apk; fi
          if ! umbenennen "$neu" Gipfel-und-Gasse.apk; then
            sleep 3
            if ! umbenennen "$neu" Gipfel-und-Gasse.apk; then
              [ -n "$alt" ] && umbenennen "$alt" Gipfel-und-Gasse.apk
              exit 1
            fi
          fi
          if [ -n "$alt" ]; then loeschen "$alt"; fi
          # Tag auf den gebauten Commit, dann Titel und Text
          wdh gh api -X PATCH "$R/git/refs/tags/neueste" -f sha="${{ github.sha }}" -F force=true >/dev/null
          wdh gh release edit neueste --latest --title "$titel" --notes "$text"
          test -n "$(asset Gipfel-und-Gasse.apk)"
