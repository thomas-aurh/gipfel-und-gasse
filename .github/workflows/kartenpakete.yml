# Baut die Offline-Kartenpakete (karten/regionen.json): Vektorkarte aus dem neuesten Protomaps-Weltdatensatz,
# Höhen aus den Terrarium-Kacheln, Probe-Rendering mit den echten Daten. Veröffentlicht auf der Release „kartenpakete“,
# von dort lädt die App: https://github.com/thomas-aurh/gipfel-und-gasse/releases/download/kartenpakete/pakete.json
# Bei Pull Requests, die die Karten betreffen: nur bauen und prüfen, nichts veröffentlichen.
name: Kartenpakete

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Nur diese Region bauen (leer = alle aus karten/regionen.json)"
        required: false
        default: ""
  schedule:
    - cron: "17 2 3 * *"   # monatlich am 3. um 02:17 UTC
  pull_request:
    paths:
      - "karten/**"
      - "web/src/58-offline.js"
      - "web/vendor/offline/**"
      - "werkzeuge/brouter-holen.sh"
      - "android/app/src/main/java/io/github/thomasaurh/gipfelundgasse/Routing.java"
      - ".github/workflows/kartenpakete.yml"

permissions:
  contents: write

concurrency:
  group: kartenpakete-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Bei Pull Requests, die nur die App betreffen (Offline-Seite, Offline-Bündel), werden die veröffentlichten Pakete
      # geprüft statt neu gebaut: das dauert Minuten statt einer halben Stunde. Neu gebaut wird bei Änderungen an
      # karten/, am Ablauf selbst, an den Routendaten-Werkzeugen und immer auf main (von Hand, monatlich).
      - name: Art des Laufs
        id: art
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "neu=true" >> "$GITHUB_OUTPUT"; echo "Lauf: neu bauen"; exit 0; fi
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > /tmp/geaendert.txt
          cat /tmp/geaendert.txt
          if grep -Eq '^(karten/|\.github/workflows/kartenpakete\.yml|werkzeuge/brouter-holen\.sh|android/app/src/main/java/io/github/thomasaurh/gipfelundgasse/Routing\.java)' /tmp/geaendert.txt; then
            echo "neu=true" >> "$GITHUB_OUTPUT"; echo "Lauf: Kartenpakete betroffen, neu bauen"
          else
            echo "neu=false" >> "$GITHUB_OUTPUT"; echo "Lauf: nur die App betroffen, veröffentlichte Pakete prüfen"
          fi

      - name: Werkzeuge
        run: |
          npm ci
          npx playwright install --with-deps chromium
          [ "${{ steps.art.outputs.neu }}" = "true" ] || exit 0
          pip install pmtiles==3.8.1 osmium==4.3.2
          mkdir -p /tmp/pmt
          gh release download -R protomaps/go-pmtiles --pattern '*Linux_x86_64.tar.gz' -D /tmp/pmt
          tar xzf /tmp/pmt/*.tar.gz -C /tmp/pmt
          /tmp/pmt/pmtiles version

      - name: Neuesten Protomaps-Weltdatensatz finden
        if: steps.art.outputs.neu == 'true'
        run: |
          for i in $(seq 0 20); do
            d=$(date -u -d "-$i day" +%Y%m%d)
            if curl -sfI "https://build.protomaps.com/$d.pmtiles" > /dev/null; then
              echo "QUELLE=https://build.protomaps.com/$d.pmtiles" >> "$GITHUB_ENV"
              echo "Quelle: $d"
              exit 0
            fi
          done
          echo "::error::Kein Protomaps-Weltdatensatz der letzten 20 Tage gefunden"
          exit 1

      - name: Bisherige Paketliste holen
        if: steps.art.outputs.neu == 'true'
        run: gh release download kartenpakete --pattern pakete.json -D /tmp/alt || echo "noch keine Liste"

      - name: Veröffentlichte Pakete holen (statt neu bauen)
        if: steps.art.outputs.neu != 'true'
        run: |
          # nur die Dateien der aktuellen Liste, jede einmal (der Release hält auch noch die der vorigen Liste)
          gh release download kartenpakete --pattern pakete.json -D ausgabe
          python3 -c "import json, os; print('\n'.join(sorted({os.path.basename(f['url']) for p in json.load(open('ausgabe/pakete.json'))['pakete'] for f in p['dateien']})))" > /tmp/dateien.txt
          while read -r f; do gh release download kartenpakete --pattern "$f" -D ausgabe; done < /tmp/dateien.txt
          # alle Regionen der Liste gelten als gebaut, damit die Proben sie prüfen
          python3 -c "import json; json.dump([p['id'] for p in json.load(open('ausgabe/pakete.json'))['pakete']], open('ausgabe/gebaut.json', 'w'))"
          ls -la ausgabe

      - name: Pakete bauen
        if: steps.art.outputs.neu == 'true'
        env:
          PMTILES: /tmp/pmt/pmtiles
        run: |
          REGION="${{ github.event_name == 'workflow_dispatch' && inputs.region || '' }}"
          # die vorige Liste nur übernehmen, wenn eine einzelne Region gebaut wird (sonst entsteht alles neu)
          ALT=""; [ -n "$REGION" ] && [ -f /tmp/alt/pakete.json ] && ALT="--alte-liste /tmp/alt/pakete.json"
          python3 karten/bauen.py ausgabe "$QUELLE" "$REGION" $ALT
          ls -la ausgabe

      - name: App bauen und Probe-Rendering mit den echten Paketen
        run: |
          sh web/build.sh
          node karten/probe.js ausgabe

      - name: Probe-Routing mit den echten Routendaten
        run: |
          sh werkzeuge/brouter-holen.sh
          if ls ausgabe/routing-*.rd5 > /dev/null 2>&1; then sh karten/routing-probe.sh ausgabe; else echo "keine Routendaten in diesem Lauf"; fi

      - name: Probe-Suche und Orte mit den echten Daten
        run: |
          if ls ausgabe/*-orte-*.json.gz > /dev/null 2>&1; then node karten/orte-probe.js ausgabe; else echo "keine Orte in diesem Lauf"; fi

      - name: Probebilder aufheben
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-bilder
          path: ausgabe/probe-*.png
          retention-days: 14

      - name: Veröffentlichen (nicht bei Pull Requests)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          gh release view kartenpakete > /dev/null 2>&1 || gh release create kartenpakete --latest=false \
            --title "Offline-Kartenpakete" \
            --notes "Kartenpakete für die App (Reiter Touren › Offline-Karten). Kartendaten © OpenStreetMap-Mitwirkende (ODbL), Vektorkacheln Protomaps; Höhen: Mapzen/Tilezen Terrain Tiles (u. a. SRTM, EU-DEM); Routendaten: BRouter; Orte: OpenStreetMap über Geofabrik."
          # erst alle Dateien (neue, unveränderliche Namen), dann die Liste, die auf sie zeigt, dann Altes entfernen
          gh release upload kartenpakete ausgabe/*.pmtiles ausgabe/*.rd5 ausgabe/*-orte-*.json.gz --clobber
          gh release upload kartenpakete ausgabe/pakete.json --clobber
          python3 karten/aufraeumen.py ausgabe/pakete.json /tmp/alt/pakete.json
