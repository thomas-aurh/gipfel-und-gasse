apply plugin: 'com.android.application'

android {
    namespace = "io.github.thomasaurh.gipfelundgasse"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.thomasaurh.gipfelundgasse"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // jede Ausgabe aus GitHub Actions bekommt eine höhere Nummer, damit Updates sich über die alte App installieren
        versionCode((System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger())
        versionName "0.1." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Signierschlüssel: fester Schlüssel aus den GitHub-Geheimnissen (release.keystore), sonst der Ersatzschlüssel,
    // den GitHub Actions einmal anlegt und im Cache aufbewahrt (ci.keystore), lokal der Debug-Schlüssel.
    // Siehe .github/workflows/app.yml
    signingConfigs {
        ersatz {
            def ks = file("ci.keystore")
            if (ks.exists()) {
                storeFile ks
                storePassword "gipfelundgasse"
                keyAlias "ci"
                keyPassword "gipfelundgasse"
            }
        }
        fest {
            def ks = file("release.keystore")
            if (ks.exists()) {
                storeFile ks
                storePassword System.getenv("KEYSTORE_PASSWORT")
                keyAlias System.getenv("KEYSTORE_ALIAS") ?: "gipfelundgasse"
                keyPassword System.getenv("KEYSTORE_PASSWORT")
            }
        }
    }
    buildTypes {
        release {
            signingConfig file("release.keystore").exists() ? signingConfigs.fest
                : file("ci.keystore").exists() ? signingConfigs.ersatz : signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// Routen-Engine BRouter (MIT) direkt als Quellen in der App: werkzeuge/brouter-holen.sh legt sie nach android/brouter/
def brouterOrdner = rootProject.file('brouter')
if (!new File(brouterOrdner, '.fassung').exists()) {
    throw new GradleException("BRouter fehlt: zuerst 'sh werkzeuge/brouter-holen.sh' im Hauptordner ausführen")
}
android.sourceSets.main.java.srcDirs += ['brouter-util', 'brouter-codec', 'brouter-expressions', 'brouter-mapaccess', 'brouter-core']
    .collect { new File(brouterOrdner, it + '/src/main/java') }

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    // org.json ist in Android-Einheitstests nur eine leere Attrappe; für RoutingTest die echte Bibliothek
    testImplementation "org.json:json:20240303"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
